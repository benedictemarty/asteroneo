# neo6502.cfg — carte mémoire cc65 pour le Neo6502 (AsteroNeo)
#
# RAM libre : $0800-$FBFF (le noyau 6502 occupe $FC00-$FFFF, le bloc de
# contrôle de l'API $FF00-$FF0F). Le programme est chargé à $0800 (à la place
# de NeoBASIC) et démarré par le vecteur reset (« cold ») ou par l'en-tête .neo.
# Pile C cc65 : 1 Ko sous $FC00.
FEATURES {
    STARTADDRESS: default = $0800;
}

MEMORY {
    ZP:        start = $0000, size = $00FF, type = rw, define = yes;
    RAM:       start = $0800, size = $F000, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    EXTZP:    load = ZP,   type = zp,  define = yes, optional = yes;
    STARTUP:  load = RAM,  type = rw;
    LOWCODE:  load = RAM,  type = rw,  optional = yes;
    ONCE:     load = RAM,  type = rw,  optional = yes;
    CODE:     load = RAM,  type = rw;
    RODATA:   load = RAM,  type = ro;
    DATA:     load = RAM,  type = rw,  define = yes;
    BSS:      load = RAM,  type = bss, define = yes;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;   # pile C : $F800-$FBFF
}
